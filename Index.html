<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF5EE; --surface: #FFFFFF; --ink: #3B2F28; --muted: #75655A; --line: #EADFD3;
    --accent: #B5532E; --accent-ink: #9A4424; --accent-soft: #F6E3D6;
    --a: #C9683F; --a-tint: #F4D8C8; --b: #E2AE45; --b-tint: #F6E5BC;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Zen Maru Gothic', sans-serif; -webkit-text-size-adjust: 100%; }
  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  #app { max-width: 480px; margin: 0 auto; padding: 24px 20px 112px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; }
  h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; color: var(--muted); font-weight: 500; }
  .muted { color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 6px; display: inline-block; flex-shrink: 0; }
  .avatar { width: 32px; height: 32px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .big { font-size: 34px; font-weight: 700; line-height: 1; }
  .pill { border-radius: 10px; padding: 2px 8px; font-size: 13px; font-weight: 700; }
  .btn { min-height: 48px; border-radius: 16px; border: none; background: var(--accent); color: #FFFFFF; font-size: 16px; font-weight: 700; padding: 0 16px; }
  .btn:disabled { opacity: .5; }
  .btn-sub { min-height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; padding: 0 14px; }
  .chip { flex-shrink: 0; min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 700; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .bar { position: relative; height: 14px; border-radius: 7px; overflow: hidden; display: flex; background: #EFE8E1; }
  .bar .marker { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; text-align: left; }
  .tile b { font-size: 14px; }
  .pt { color: var(--accent-ink); font-weight: 700; }
  .notice { background: var(--accent-soft); border: none; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; }
  .notice .icon { width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
  .item { width: 100%; text-align: left; min-height: 56px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
  .item.on { border-color: var(--accent); }
  .item .crit { font-size: 13px; line-height: 1.6; color: var(--muted); }
  .panel { position: sticky; bottom: 92px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 24px rgba(59,47,40,.10); }
  .toggle { flex: 1 1 0; min-height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .toggle.on { background: var(--accent-soft); border-color: var(--accent); }
  .track { width: 34px; height: 20px; border-radius: 10px; background: #CDBFB3; position: relative; display: inline-block; }
  .track i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF; transition: left .15s; }
  .toggle.on .track { background: var(--accent); }
  .toggle.on .track i { left: 16px; }
  .date { flex: 1 1 0; min-height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; font-size: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  .field input, .field select { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 14px; color: var(--ink); }
  .status { font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 8px; }
  .comment { display: flex; gap: 8px; align-items: flex-start; background: var(--bg); border-radius: 12px; padding: 8px 10px; font-size: 13px; line-height: 1.5; }
  .link { background: none; border: none; padding: 0; color: var(--accent-ink); font-size: 13px; font-weight: 500; }
  .list-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #F1E9E0; font-size: 14px; }
  .list-row:last-child { border-bottom: none; }
  .center { text-align: center; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 4px calc(14px + env(safe-area-inset-bottom)); }
  nav .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  nav button { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 500; min-height: 48px; justify-content: center; }
  nav button.on { color: var(--accent); font-weight: 700; }
  nav .badge { position: absolute; top: -4px; right: -9px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  #toast { position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%); background: var(--ink); color: #FFFFFF; padding: 10px 16px; border-radius: 14px; font-size: 14px; max-width: 88vw; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  #toast.show { opacity: 1; }
  #toast.error { background: #8E2A1B; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(251,245,238,.6); z-index: 9; }
  #loading[hidden] { display: none; }
  .spinner { width: 32px; height: 32px; border-radius: 16px; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"><p class="center muted">読み込み中…</p></div>
<nav id="nav" aria-label="メインメニュー"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="loading" hidden><div class="spinner" aria-label="処理中"></div></div>

<script>
var S = null;
var view = 'home';
var ui = { cat: null, sel: null, date: null, together: false, who: 'all', comments: {}, reward: {} };

var ICON = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',
  record: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  ticket: '<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 8v8" stroke-dasharray="2 2"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  chevron: '<path d="M9 6l6 6-6 6"/>'
};
function icon(name, size) {
  size = size || 24;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function signed(v) {
  v = Math.round(v);
  if (v > 0) return '+' + v;
  if (v < 0) return '−' + Math.abs(v);
  return '±0';
}
function sideOf(name) { return name === S.names.A ? 'A' : 'B'; }
function initial(name) { return esc(String(name).charAt(0)); }
function avatar(side, name) {
  return '<span class="avatar" style="background: var(--' + side.toLowerCase() + '-tint)">' + initial(name) + '</span>';
}
function dot(side) { return '<span class="dot" style="background: var(--' + side.toLowerCase() + ')"></span>'; }

// ---------------------------------------------------------------- 通信
function call(fn, args, message, after) {
  setBusy(true);
  var runner = google.script.run
    .withSuccessHandler(function (state) {
      S = state;
      setBusy(false);
      if (after) after();
      render();
      if (message) toast(message);
    })
    .withFailureHandler(function (err) {
      setBusy(false);
      toast((err && err.message) || String(err), true);
    });
  runner[fn].apply(runner, args || []);
}
function setBusy(on) { document.getElementById('loading').hidden = !on; }
var toastTimer = null;
function toast(msg, isError) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = ''; }, isError ? 5000 : 2500);
}

// ---------------------------------------------------------------- 画面
function homeView() {
  var m = S.month, n = S.names;
  var total = m.ptA + m.ptB;
  var shareA = total ? Math.round(m.ptA / total * 100) : 50;
  var targetA = Math.round(m.ratioA * 100);
  var freq = S.frequent.map(function (id) {
    var c = S.master.filter(function (x) { return x.id === id; })[0];
    if (!c) return '';
    return '<button class="tile" data-act="quick" data-id="' + esc(c.id) + '"><b>' + esc(c.name) + '</b><span class="pt">' + c.pt + 'pt</span></button>';
  }).join('');
  var notice = S.pending.length
    ? '<button class="notice" data-act="go" data-view="thanks"><span class="icon">' + icon('heart', 22) + '</span>' +
      '<span style="display:flex;flex-direction:column;gap:2px;flex-grow:1"><b style="font-size:15px">' + esc(S.me.partner) + 'の家事が' + S.pending.length + '件、確認待ちです</b>' +
      '<span style="font-size:12px;color:var(--accent-ink)">ありがとうを送ると、ptが届きます</span></span>' +
      '<span style="color:var(--accent-ink)">' + icon('chevron', 18) + '</span></button>'
    : '';
  return '' +
    '<header class="between" style="align-items:flex-end"><div style="display:flex;flex-direction:column;gap:2px"><span class="sub">' + esc(m.label) + '</span><h1>ふたりの家事</h1></div>' +
    '<div class="row" style="gap:0">' + avatar('A', n.A) + '<span style="margin-left:-8px">' + avatar('B', n.B) + '</span></div></header>' +
    '<section class="card" aria-label="今月のバランス">' +
      '<div class="grid2" style="gap:12px">' +
        '<div style="display:flex;flex-direction:column;gap:6px"><div class="row">' + dot('A') + '<b>' + esc(n.A) + '</b></div>' +
          '<div class="row" style="align-items:baseline;gap:4px"><span class="big">' + m.ptA + '</span><span class="muted">pt</span></div>' +
          '<div class="row" style="font-size:13px"><span class="muted">目標 ' + m.targetA + '</span><span class="pill" style="background:var(--a-tint)">' + signed(m.diffA) + '</span></div></div>' +
        '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right"><div class="row"><b>' + esc(n.B) + '</b>' + dot('B') + '</div>' +
          '<div class="row" style="align-items:baseline;gap:4px"><span class="big">' + m.ptB + '</span><span class="muted">pt</span></div>' +
          '<div class="row" style="font-size:13px"><span class="pill" style="background:var(--b-tint)">' + signed(m.diffB) + '</span><span class="muted">目標 ' + m.targetB + '</span></div></div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:6px">' +
        '<div class="bar">' + (total ? '<div style="width:' + shareA + '%;background:var(--a)"></div><div style="width:' + (100 - shareA) + '%;background:var(--b)"></div>' : '') +
        '<div class="marker" style="left:' + targetA + '%"></div></div>' +
        '<div class="between muted" style="font-size:12px"><span>' + (total ? shareA + '%' : '') + '</span><span>目標 ' + targetA + ' : ' + (100 - targetA) + '</span><span>' + (total ? (100 - shareA) + '%' : '') + '</span></div>' +
      '</div>' +
      '<div style="border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px;font-size:13px" class="muted">' +
        '<div class="between"><span>前月からの繰越込み</span><span style="color:var(--ink);font-weight:500">' + esc(n.A) + ' ' + signed(m.cumA) + ' ／ ' + esc(n.B) + ' ' + signed(m.cumB) + '</span></div>' +
        '<span>どちらかが +' + S.unit + ' になると、チケットが1枚発行されます</span>' +
      '</div>' +
    '</section>' +
    notice +
    '<section style="display:flex;flex-direction:column;gap:10px" aria-label="よく記録する家事"><div class="between"><h2>よく記録する家事</h2><button class="link" data-act="go" data-view="record">すべての家事</button></div>' +
    '<div class="grid2">' + freq + '</div></section>';
}

function recordView() {
  if (!ui.cat || S.cats.indexOf(ui.cat) < 0) ui.cat = S.cats[0];
  var items = S.master.filter(function (c) { return c.cat === ui.cat; });
  if (!items.some(function (c) { return c.id === ui.sel; })) ui.sel = items.length ? items[0].id : null;
  var cur = S.master.filter(function (c) { return c.id === ui.sel; })[0];
  var minDate = (function () {
    var d = new Date(S.today + 'T00:00:00'); d.setDate(d.getDate() - 7);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  })();
  var tabs = S.cats.map(function (c) {
    return '<button role="tab" aria-selected="' + (c === ui.cat) + '" class="chip' + (c === ui.cat ? ' on' : '') + '" data-act="cat" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
  }).join('');
  var list = items.map(function (c) {
    var on = c.id === ui.sel;
    return '<button class="item' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-act="sel" data-id="' + esc(c.id) + '">' +
      '<span class="between" style="width:100%;align-items:center"><b style="font-size:15px">' + esc(c.name) + '</b><span class="pt" style="flex-shrink:0">' + c.pt + 'pt</span></span>' +
      (on ? '<span class="crit">' + esc(c.crit) + '</span>' : '') + '</button>';
  }).join('');
  var panel = cur ? '<section class="panel" aria-label="記録の内容">' +
    '<div class="between"><b style="font-size:16px">' + esc(cur.name) + '</b><span class="pt" style="font-size:20px">' + (ui.together ? 0 : cur.pt) + 'pt</span></div>' +
    '<span class="muted" style="font-size:13px">' + (ui.together
      ? '一緒にやった家事は、ふたりのタイムラインに残りますがポイントはつきません'
      : '記録した時点で ' + cur.base + 'pt、' + esc(S.me.partner) + 'のありがとうで +' + cur.thanks + 'pt') + '</span>' +
    '<div class="row"><label style="flex:1 1 0;display:flex"><span class="sr" style="position:absolute;left:-9999px">実施日</span>' +
    '<input class="date" type="date" data-input="date" value="' + esc(ui.date || S.today) + '" min="' + minDate + '" max="' + esc(S.today) + '"></label>' +
    '<button class="toggle' + (ui.together ? ' on' : '') + '" aria-pressed="' + ui.together + '" data-act="together"><span class="track"><i></i></span>一緒にやった</button></div>' +
    '<button class="btn" data-act="record">記録する</button></section>' : '';
  return '<header class="between" style="align-items:flex-end"><div style="display:flex;flex-direction:column;gap:2px"><span class="sub">' + esc(S.me.name) + ' として記録</span><h1>家事を記録</h1></div><span class="sub">' + esc(S.todayLabel) + '</span></header>' +
    '<div class="chips" role="tablist" aria-label="カテゴリ">' + tabs + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:8px">' + list + '</div>' + panel;
}

function thanksView() {
  var p = S.pending;
  var sum = p.reduce(function (a, x) { return a + x.thanks; }, 0);
  var cards = p.map(function (c) {
    return '<article class="card" style="padding:16px;gap:12px">' +
      '<div class="between" style="align-items:flex-start"><div style="display:flex;flex-direction:column;gap:4px"><b style="font-size:16px">' + esc(c.chore) + '</b><span class="muted" style="font-size:12px">' + esc(c.when) + '</span></div>' +
      '<span class="pill" style="background:var(--accent-soft);color:var(--accent-ink);flex-shrink:0">+' + c.thanks + 'pt</span></div>' +
      '<label class="field">ひとこと（なくてもOK）<input type="text" maxlength="100" placeholder="例：助かった！" data-input="comment" data-id="' + esc(c.id) + '" value="' + esc(ui.comments[c.id] || '') + '"></label>' +
      '<div class="row"><button class="btn-sub" data-act="hold" data-id="' + esc(c.id) + '">確認したい</button><button class="btn" style="flex:1 1 auto;min-height:44px;font-size:15px" data-act="thank" data-id="' + esc(c.id) + '">ありがとう</button></div>' +
      '<span class="muted" style="font-size:12px">確認がなくても、あと' + c.hoursLeft + '時間で自動的にありがとうが届きます</span></article>';
  }).join('');
  var held = S.held.length ? '<section style="display:flex;flex-direction:column;gap:10px"><h2>保留中</h2>' + S.held.map(function (h) {
    return '<article class="card" style="padding:14px 16px;gap:10px"><div class="between"><b>' + esc(h.chore) + '</b><span class="pt">' + h.pt + 'pt</span></div>' +
      '<span class="muted" style="font-size:12px">' + esc(h.when) + ' ・ 2人で話してから確定してください</span>' +
      '<div class="row"><button class="btn-sub" data-act="drop" data-id="' + esc(h.id) + '">記録を取り消す</button><button class="btn" style="flex:1 1 auto;min-height:44px;font-size:15px" data-act="keep" data-id="' + esc(h.id) + '">このまま確定</button></div></article>';
  }).join('') + '</section>' : '';
  return '<header style="display:flex;flex-direction:column;gap:2px"><span class="sub">' + (p.length ? esc(S.me.partner) + 'の家事 ' + p.length + '件が確認待ち' : 'すべて確認しました') + '</span><h1>ありがとう</h1></header>' +
    (p.length > 1 ? '<button class="btn" data-act="thankAll">' + icon('heart', 20) + ' まとめてありがとう（' + p.length + '件・+' + sum + 'pt）</button>' : '') +
    cards + (p.length ? '' : '<p class="center muted" style="margin:8px 0">確認待ちの家事はありません</p>') + held;
}

var STATUS_CHIP = {
  '未確認': ['確認待ち', '#FFFFFF', 'dashed', '#CDBFB3'],
  '確認済み': ['ありがとう済み', '#F6E3D6', 'solid', '#F6E3D6'],
  '自動付与': ['自動付与', '#EFE8E1', 'solid', '#EFE8E1'],
  '保留': ['保留中', '#FFFFFF', 'solid', '#B5532E'],
  'both': ['一緒に', '#F6E5BC', 'solid', '#F6E5BC']
};
function timelineView() {
  var who = ui.who;
  var filters = [['all', 'すべて'], ['A', S.names.A], ['B', S.names.B]].map(function (f) {
    return '<button class="chip' + (who === f[0] ? ' on' : '') + '" aria-pressed="' + (who === f[0]) + '" data-act="who" data-who="' + f[0] + '">' + esc(f[1]) + '</button>';
  }).join('');
  var groups = S.timeline.map(function (g) {
    var entries = g.entries.filter(function (e) { return who === 'all' || e.side === who || e.side === 'both'; });
    if (!entries.length) return '';
    return '<section style="display:flex;flex-direction:column;gap:8px"><h2 style="font-size:13px;color:var(--muted)">' + esc(g.day) + '</h2>' + entries.map(function (e) {
      var chip = STATUS_CHIP[e.status] || STATUS_CHIP['未確認'];
      var av = e.side === 'both'
        ? avatar('A', S.names.A) + '<span style="margin-left:-12px">' + avatar('B', S.names.B) + '</span>'
        : avatar(e.side, e.who);
      return '<article class="card" style="padding:12px 14px;gap:8px;border-radius:16px">' +
        '<div class="row" style="gap:10px"><span class="row" style="gap:0;flex-shrink:0">' + av + '</span>' +
        '<div style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0"><b style="font-size:14px">' + esc(e.chore) + '</b><span class="muted" style="font-size:12px">' + esc(e.who) + ' ・ ' + esc(e.time) + '</span></div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0"><span class="pt" style="font-size:14px">' + e.pt + 'pt</span>' +
        '<span class="status" style="background:' + chip[1] + ';border:1px ' + chip[2] + ' ' + chip[3] + '">' + chip[0] + '</span></div></div>' +
        (e.comment ? '<div class="comment"><span style="color:var(--accent);flex-shrink:0">' + icon('heart', 16) + '</span><span>' + esc(e.commenter) + '：' + esc(e.comment) + '</span></div>' : '') +
        (e.canUndo ? '<div style="display:flex;justify-content:flex-end"><button class="link" data-act="undo" data-id="' + esc(e.id) + '">この記録を取り消す</button></div>' : '') +
        '</article>';
    }).join('') + '</section>';
  }).join('');
  return '<header style="display:flex;flex-direction:column;gap:2px"><span class="sub">ふたりの記録（直近2週間）</span><h1>タイムライン</h1></header>' +
    '<div class="chips" role="group" aria-label="表示する人">' + filters + '</div>' +
    (groups || '<p class="center muted">まだ記録がありません</p>');
}

function settleView() {
  var m = S.month, n = S.names;
  var lean = Math.max(-50, Math.min(50, (m.cumB / S.unit) * 50));
  var pos = 50 + lean;
  var leanColor = lean >= 0 ? 'var(--b)' : 'var(--a)';
  var fill = lean >= 0
    ? '<div style="position:absolute;left:50%;width:' + lean + '%;top:0;bottom:0;background:' + leanColor + ';border-radius:0 5px 5px 0"></div>'
    : '<div style="position:absolute;left:' + pos + '%;width:' + (-lean) + '%;top:0;bottom:0;background:' + leanColor + ';border-radius:5px 0 0 5px"></div>';
  var forecast = m.count > 0
    ? 'このままだと、' + esc(m.receiver) + 'にチケットが' + m.count + '枚発行されます。'
    : 'このままだと' + esc(m.shortLabel) + 'は発行なしで、差は翌月に繰り越されます。';
  function ticketCol(side) {
    var list = S.tickets[side];
    var body = list.length ? list.map(function (t) {
      var use = '';
      if (t.mine) {
        var opts = S.rewards.map(function (r) {
          return '<option value="' + esc(r.name) + '"' + (ui.reward[t.id] === r.name ? ' selected' : '') + '>' + esc(r.name) + '</option>';
        }).join('');
        use = '<label class="field" style="margin-top:4px">何に使う？<select data-input="reward" data-id="' + esc(t.id) + '">' + opts + '</select></label>' +
          '<button class="btn" style="min-height:40px;font-size:14px" data-act="use" data-id="' + esc(t.id) + '">このチケットを使う</button>';
      }
      return '<div style="display:flex;flex-direction:column;gap:2px;background:var(--' + side.toLowerCase() + '-tint);border-radius:10px;padding:8px">' +
        '<b style="font-size:12px">' + esc(t.month) + '</b><span style="font-size:11px">' + esc(t.expiry) + '</span>' + use + '</div>';
    }).join('') : '<span class="muted" style="font-size:12px">いまはありません</span>';
    return '<div class="card" style="padding:14px;gap:8px;border-radius:18px"><span class="row" style="font-size:13px;font-weight:700">' + dot(side) + esc(n[side]) + '</span>' +
      '<span style="font-size:28px;font-weight:700;line-height:1">' + list.length + '<span class="muted" style="font-size:13px;font-weight:500"> 枚</span></span>' + body + '</div>';
  }
  var history = S.history.length ? S.history.map(function (h) {
    return '<article class="card" style="padding:14px 16px;gap:8px;border-radius:18px"><div class="between" style="align-items:center"><b style="font-size:15px">' + esc(h.month) + '</b>' +
      '<span class="status" style="font-size:12px;background:' + (h.count ? 'var(--' + sideOf(h.receiver).toLowerCase() + '-tint)' : '#EFE8E1') + '">' + (h.count ? esc(h.receiver) + 'に' + h.count + '枚' : '発行なし') + '</span></div>' +
      '<span class="muted" style="font-size:13px">過不足 ' + esc(n.A) + ' ' + signed(h.diffA) + ' ／ ' + esc(n.B) + ' ' + signed(h.diffB) + '</span>' +
      '<div class="between muted" style="font-size:13px"><span>翌月繰越 ' + esc(n.A) + ' ' + signed(h.nextA) + ' ／ ' + esc(n.B) + ' ' + signed(h.nextB) + '</span><span>' + esc(h.fixedAt) + ' 確定</span></div></article>';
  }).join('') : '<p class="muted" style="margin:0;font-size:13px">まだ確定した月はありません</p>';
  var rewards = S.rewards.map(function (r) { return '<div class="list-row"><span>' + esc(r.name) + '</span><span class="muted">1枚</span></div>'; }).join('');

  return '<header style="display:flex;flex-direction:column;gap:2px"><span class="sub">' + esc(m.shortLabel) + '分は ' + esc(m.settleOn) + 'に確定します</span><h1>精算・チケット</h1></header>' +
    '<section class="card" aria-label="今月の見込み"><h2 style="font-size:15px">' + esc(m.shortLabel) + 'の見込み</h2>' +
      '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px;align-items:center">' +
        '<span class="row" style="font-weight:700;gap:6px">' + dot('A') + esc(n.A) + '</span><span class="center muted">項目</span><span class="row" style="font-weight:700;gap:6px;justify-content:flex-end">' + esc(n.B) + dot('B') + '</span>' +
        '<b>' + signed(m.diffA) + '</b><span class="center muted">今月の過不足</span><b style="text-align:right">' + signed(m.diffB) + '</b>' +
        '<b>' + signed(m.prevA) + '</b><span class="center muted">前月からの繰越</span><b style="text-align:right">' + signed(m.prevB) + '</b>' +
        '<b style="font-size:18px">' + signed(m.cumA) + '</b><span class="center muted">繰越込み</span><b style="font-size:18px;text-align:right">' + signed(m.cumB) + '</b>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:6px"><div style="position:relative;height:10px;border-radius:5px;background:#EFE8E1">' +
        '<div style="position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:#CDBFB3"></div>' + fill +
        '<div style="position:absolute;left:' + pos + '%;top:-5px;width:20px;height:20px;margin-left:-10px;border-radius:10px;background:#FFFFFF;border:3px solid ' + leanColor + '"></div></div>' +
        '<div class="between muted" style="font-size:11px"><span>' + esc(n.A) + 'に1枚</span><span>±0</span><span>' + esc(n.B) + 'に1枚</span></div></div>' +
      '<p class="muted" style="margin:0;font-size:13px;line-height:1.6">どちらかが端（' + S.unit + 'pt）に届くとチケットが1枚発行されます。' + forecast + '</p>' +
    '</section>' +
    '<section style="display:flex;flex-direction:column;gap:10px" aria-label="手持ちのチケット"><h2>手持ちのチケット</h2><div class="grid2" style="align-items:start">' + ticketCol('A') + ticketCol('B') + '</div>' +
    '<span class="muted" style="font-size:12px">チケットは、持っている人が自分の画面から使います</span></section>' +
    '<section class="card" style="padding:6px 16px;gap:0" aria-label="チケット1枚で頼めること"><h2 style="font-size:15px;margin:10px 0 4px">チケット1枚で頼めること</h2>' + rewards + '</section>' +
    '<section style="display:flex;flex-direction:column;gap:10px" aria-label="これまでの精算"><h2>これまでの精算</h2>' + history + '</section>';
}

var VIEWS = { home: homeView, record: recordView, thanks: thanksView, timeline: timelineView, settle: settleView };

function renderNav() {
  var items = [['home', 'home', 'ホーム'], ['record', 'record', '記録'], ['thanks', 'heart', 'ありがとう'], ['timeline', 'clock', 'タイムライン'], ['settle', 'ticket', '精算']];
  document.getElementById('nav').innerHTML = '<div class="inner">' + items.map(function (it) {
    var badge = it[0] === 'thanks' && S && S.pending.length ? '<span class="badge">' + S.pending.length + '</span>' : '';
    return '<button class="' + (view === it[0] ? 'on' : '') + '"' + (view === it[0] ? ' aria-current="page"' : '') + ' data-act="go" data-view="' + it[0] + '">' +
      '<span style="position:relative;display:flex">' + icon(it[1]) + badge + '</span><span>' + it[2] + '</span></button>';
  }).join('') + '</div>';
}

function render() {
  if (!S) return;
  document.getElementById('app').innerHTML = VIEWS[view]();
  renderNav();
}

function go(v) {
  view = v;
  render();
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- 操作
var ACTIONS = {
  go: function (el) { go(el.dataset.view); },
  quick: function (el) {
    var c = S.master.filter(function (x) { return x.id === el.dataset.id; })[0];
    if (c) { ui.cat = c.cat; ui.sel = c.id; ui.together = false; }
    go('record');
  },
  cat: function (el) { ui.cat = el.dataset.cat; ui.sel = null; render(); },
  sel: function (el) { ui.sel = el.dataset.id; render(); },
  together: function () { ui.together = !ui.together; render(); },
  record: function () {
    var c = S.master.filter(function (x) { return x.id === ui.sel; })[0];
    if (!c) return;
    var together = ui.together;
    call('recordChore', [c.id, ui.date || S.today, together],
      together ? '「' + c.name + '」を一緒にやった記録にしました' : '「' + c.name + '」を記録しました（' + c.base + 'pt）',
      function () { ui.together = false; ui.date = null; });
  },
  thank: function (el) {
    var id = el.dataset.id;
    call('sendThanks', [[{ id: id, comment: ui.comments[id] || '' }]], 'ありがとうを送りました', function () { delete ui.comments[id]; });
  },
  thankAll: function () {
    var items = S.pending.map(function (p) { return { id: p.id, comment: ui.comments[p.id] || '' }; });
    call('sendThanks', [items], 'まとめてありがとうを送りました', function () { ui.comments = {}; });
  },
  hold: function (el) {
    if (!confirm('この家事を保留にしますか？2人で話して確定するまで、ptは集計されません。')) return;
    call('holdLog', [el.dataset.id], '保留にしました');
  },
  keep: function (el) { call('resolveHold', [el.dataset.id, true], '確定しました'); },
  drop: function (el) {
    if (!confirm('この記録を取り消しますか？')) return;
    call('resolveHold', [el.dataset.id, false], '記録を取り消しました');
  },
  undo: function (el) {
    if (!confirm('この記録を取り消しますか？')) return;
    call('undoLog', [el.dataset.id], '記録を取り消しました');
  },
  who: function (el) { ui.who = el.dataset.who; render(); },
  use: function (el) {
    var id = el.dataset.id;
    var reward = ui.reward[id] || (S.rewards[0] && S.rewards[0].name);
    if (!reward) return;
    if (!confirm('「' + reward + '」にチケットを使いますか？')) return;
    call('useTicket', [id, reward], '「' + reward + '」にチケットを使いました');
  }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || !S) return;
  var fn = ACTIONS[el.dataset.act];
  if (fn) fn(el);
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.dataset.input === 'comment') ui.comments[el.dataset.id] = el.value;
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset.input === 'date') ui.date = el.value;
  if (el.dataset.input === 'reward') ui.reward[el.dataset.id] = el.value;
});

google.script.run
  .withSuccessHandler(function (state) { S = state; render(); })
  .withFailureHandler(function (err) {
    document.getElementById('app').innerHTML = '<div class="card"><h2>読み込めませんでした</h2><p class="muted" style="margin:0;font-size:14px;line-height:1.6">' + esc((err && err.message) || String(err)) + '</p></div>';
  })
  .getState();
</script>
</body>
</html>
